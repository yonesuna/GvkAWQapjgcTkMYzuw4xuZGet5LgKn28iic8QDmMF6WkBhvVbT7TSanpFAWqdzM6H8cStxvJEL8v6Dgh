<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>まごころゴルフ in 別府決戦</title>
  <style>
    :root {
      --bg: #eaf4ea;
      --panel: #f7fbf4;
      --ink: #142418;
      --muted: #526b59;
      --line: #b8d0bd;
      --green: #287245;
      --green-dark: #174c31;
      --green-soft: #dceee0;
      --green-pale: #eef7ed;
      --gold: #7a8f2a;
      --red: #b84232;
      --team-a: #b84232;
      --team-b: #2b5da8;
      --blue: #2b736c;
      --shadow: 0 12px 28px rgba(16, 58, 34, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(40, 114, 69, 0.2), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(43, 115, 108, 0.16), transparent 28%),
        linear-gradient(135deg, #f3faf0 0%, #dfeede 52%, #cfe6d5 100%);
      min-height: 100vh;
    }

    button, input, select { font: inherit; }

    .app {
      width: min(1220px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    header {
      display: block;
      padding: 18px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 52px);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .field input, .field select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(247, 251, 244, 0.94);
      color: var(--ink);
      min-width: 0;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .tab-button {
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.3;
    }

    .tab-button.active {
      background: var(--panel);
      border-color: var(--line);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .panel {
      display: none;
      background: rgba(247, 251, 244, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .panel.active { display: block; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--green);
      color: white;
      cursor: pointer;
      min-height: 42px;
    }

    .button.secondary {
      background: var(--green-soft);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      color: var(--muted);
      min-height: 22px;
      font-size: 14px;
    }

    .status.error { color: var(--red); }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .team-total {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(40, 114, 69, 0.16), rgba(43, 115, 108, 0.12));
    }

    .team-total strong {
      display: block;
      font-size: 18px;
    }

    .team-total > span {
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 700;
    }

    .team-total-breakdown {
      display: grid;
      gap: 3px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .team-total-breakdown strong {
      display: grid;
      grid-template-columns: 96px auto;
      gap: 8px;
      margin: 0;
      font-size: inherit;
      line-height: inherit;
    }

    .team-total-breakdown .point-value {
      text-align: right;
    }

    .team-kan-breakdown {
      display: grid;
      gap: 2px;
      margin-top: 4px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
    }

    .team-total.team-a {
      border-left: 8px solid var(--team-a);
      background: linear-gradient(135deg, rgba(184, 66, 50, 0.28), rgba(184, 66, 50, 0.1));
    }

    .team-total.team-b {
      border-left: 8px solid var(--team-b);
      background: linear-gradient(135deg, rgba(43, 93, 168, 0.28), rgba(43, 93, 168, 0.1));
    }
    .team-total.team-a strong, .team-total.team-a span { color: var(--team-a); }
    .team-total.team-b strong, .team-total.team-b span { color: var(--team-b); }
    .team-total.winning {
      transform: scale(1.04);
      position: relative;
      z-index: 1;
    }
    .team-total.team-a.winning { box-shadow: 0 0 0 4px var(--team-a), 0 10px 24px rgba(184, 66, 50, 0.4); }
    .team-total.team-b.winning { box-shadow: 0 0 0 4px var(--team-b), 0 10px 24px rgba(43, 93, 168, 0.4); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: right;
      white-space: nowrap;
      font-size: 14px;
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) { text-align: left; }

    th {
      background: #dbeadd;
      color: #1f3d29;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    tbody tr:last-child td { border-bottom: 0; }

    .team-a td {
      background: rgba(184, 66, 50, 0.22);
      border-bottom-color: rgba(184, 66, 50, 0.35);
    }

    .team-b td {
      background: rgba(43, 93, 168, 0.2);
      border-bottom-color: rgba(43, 93, 168, 0.35);
    }

    .team-a td:nth-child(2) {
      color: var(--team-a);
      font-weight: 700;
    }

    .team-b td:nth-child(2) {
      color: var(--team-b);
      font-weight: 700;
    }

    .entry-layout {
      display: grid;
      gap: 16px;
    }

    .entry-card {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .member-field {
      max-width: 320px;
    }

    .stepper {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 6px;
      align-items: center;
    }

    .stepper button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--green-soft);
      min-height: 42px;
      cursor: pointer;
    }

    .stepper input { text-align: center; }

    .complete-field {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .hole-title .complete-field {
      flex-shrink: 0;
    }

    .holes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, auto));
      grid-auto-flow: column;
      gap: 10px;
    }

    .entry-totals {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(40, 114, 69, 0.12), rgba(43, 115, 108, 0.08));
    }

    .entry-subtotals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .entry-total {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .entry-total-values {
      display: grid;
      gap: 3px;
    }

    .entry-total-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .entry-total strong {
      color: var(--ink);
      font-size: 24px;
    }

    .entry-subtotals .entry-total {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(238, 247, 237, 0.72);
    }

    .hole {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(238, 247, 237, 0.72);
      padding: 10px;
      display: grid;
      gap: 9px;
    }

    .hole-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
    }

    .hole-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
    }

    .hole-par {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .near-pin {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .near-pin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border: 1px solid rgba(190, 145, 0, 0.65);
      border-radius: 999px;
      background: #f5d85f;
      color: #5b4300;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
    }

    .near-pin-badge input[type="checkbox"] {
      margin: 0;
      width: 15px;
      height: 15px;
    }

    .near-pin-badge:has(input:checked) {
      background: #f7c400;
      border-color: #8a6600;
      box-shadow: 0 0 0 2px rgba(245, 200, 60, 0.5);
    }

    .hole-error {
      display: none;
      color: var(--red);
      font-size: 12px;
      line-height: 1.4;
    }

    .hole-error.visible { display: block; }

    .error-box {
      display: none;
      border: 1px solid rgba(184, 66, 50, 0.45);
      color: var(--red);
      background: rgba(184, 66, 50, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .error-box.visible { display: block; }

    .points-table {
      width: 100%;
      min-width: 0;
    }

    .points-table th,
    .points-table td {
      text-align: left;
    }

    .points-table td:last-child,
    .points-table th:last-child {
      text-align: right;
    }

    .points-section {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .admin-section {
      display: grid;
      gap: 14px;
    }

    .admin-section + .admin-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .admin-section-title {
      margin: 0;
      font-size: 22px;
    }

    .points-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .points-section h2 {
      margin: 0;
      font-size: 18px;
    }

    .points-section .table-wrap {
      align-self: start;
    }

    .table-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .mission-list { display: grid; gap: 10px; }

    .mission-table {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(238, 247, 237, 0.72);
    }

    .mission-grid-header,
    .mission-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .mission-grid-header {
      padding: 6px 0px;
      border-radius: 8px;
      background: rgba(24, 71, 58, 0.06);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .mission-grid-header > span:nth-child(2),
    .mission-grid-header > span:nth-child(3),
    .mission-row > label {
      justify-self: center;
    }

    .mission-row {
      padding: 0;
      border: none;
      background: transparent;
    }

    .mission-row select {
      width: 100%;
      min-width: 0;
      min-height: 36px;
    }

    .mission-row label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 84px;
      padding: 0;
      font-size: 14px;
      color: var(--ink);
    }

    .mission-row input[type="checkbox"] {
      margin: 0;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .admin-actions {
      display: flex;
      justify-content: flex-end;
    }

    .rule-list {
      margin: 0;
      padding: 12px 16px 12px 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      line-height: 1.8;
    }

    @media (max-width: 860px) {
      header, .fields { grid-template-columns: 1fr; }
      header { display: grid; align-items: start; }
      .team-total { padding: 12px; }
      .team-total > span { font-size: clamp(26px, 8vw, 38px); }
      .holes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panel { padding: 12px; }
      .points-grid { grid-template-columns: 1fr; }
      .rules-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .tabs {
        gap: 3px;
        margin-bottom: 12px;
        align-items: stretch;
      }

      .tab-button {
        flex: 1 1 0;
        min-width: 0;
        padding: 7px 4px;
        font-size: 14px;
        white-space: normal;
      }

      .mission-grid-header,
      .mission-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .mission-grid-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .mission-row {
        gap: 6px;
      }

      .mission-row label {
        min-width: 74px;
        justify-content: center;
        padding: 0;
      }

      .mission-row select {
        min-height: 34px;
      }

      table { min-width: 420px; }

      th, td {
        padding: 6px 6px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>⛳まごころゴルフin別府決戦</h1>
    </header>

    <nav class="tabs" aria-label="表示切替">
      <button class="tab-button active" type="button" data-tab="ranking">順位表</button>
      <button class="tab-button" type="button" data-tab="entry">スコア入力</button>
      <button class="tab-button" type="button" data-tab="mission">ミッション</button>
      <button class="tab-button" type="button" data-tab="admin">その他</button>
    </nav>

    <section class="panel active" id="rankingPanel">
      <div class="toolbar">
        <div class="status" id="rankingStatus"></div>
        <button class="button" id="reloadButton" type="button">再読み込み</button>
      </div>
      <div class="team-grid" id="teamTotals"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>順位</th>
              <th>メンバー</th>
              <th>合計</th>
              <th>進行</th>
              <th>オリンピック</th>
              <th>ニアピン</th>
              <th>スコア</th>
              <th>グロス順位</th>
              <th>ネット順位</th>
            </tr>
          </thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="entryPanel">
      <div class="entry-layout">
        <section class="entry-card">
          <div class="error-box" id="validationErrors"></div>
          <label class="field member-field">
            <select id="memberSelect"></select>
          </label>
          <div class="holes" id="holes"></div>
          <div class="entry-totals" aria-label="縦計">
            <div class="entry-subtotals">
              <div class="entry-total">
                <span>10H〜18H小計</span>
                <div class="entry-total-values">
                  <div class="entry-total-line"><span>スコア</span><strong id="entryBackScoreTotal">0</strong></div>
                  <div class="entry-total-line"><span>オリンピック</span><strong id="entryBackOlympicTotal">0</strong></div>
                </div>
              </div>
              <div class="entry-total">
                <span>1H〜9H小計</span>
                <div class="entry-total-values">
                  <div class="entry-total-line"><span>スコア</span><strong id="entryFrontScoreTotal">0</strong></div>
                  <div class="entry-total-line"><span>オリンピック</span><strong id="entryFrontOlympicTotal">0</strong></div>
                </div>
              </div>
            </div>
            <div class="entry-total">
              <span>総合計</span>
              <div class="entry-total-values">
                <div class="entry-total-line"><span>スコア</span><strong id="entryScoreTotal">0</strong></div>
                <div class="entry-total-line"><span>オリンピック</span><strong id="entryOlympicTotal">0</strong></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section class="panel" id="missionPanel">
      <div class="entry-layout">
        <div class="mission-list" id="missionList"></div>
      </div>
    </section>

    <section class="panel" id="adminPanel">
      <section class="admin-section">
        <h2 class="admin-section-title">ポイント表</h2>
        <div class="points-grid">
          <section class="points-section">
            <h2>オリンピック</h2>
            <div class="table-wrap">
              <table class="points-table">
                <thead><tr><th>項目</th><th>ポイント</th></tr></thead>
                <tbody id="olympicPointsTableBody"></tbody>
              </table>
            </div>
            <p class="table-note">カンあり：各組でのチーム達成×２倍</p>
          </section>
          <section class="points-section">
            <h2>グロス順位</h2>
            <div class="table-wrap">
              <table class="points-table">
                <thead><tr><th>項目</th><th>ポイント</th></tr></thead>
                <tbody id="grossPointsTableBody"></tbody>
              </table>
            </div>
          </section>
          <section class="points-section">
            <h2>ネット順位</h2>
            <div class="table-wrap">
              <table class="points-table">
                <thead><tr><th>項目</th><th>ポイント</th></tr></thead>
                <tbody id="netPointsTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="rules-grid">
          <section class="points-section">
            <h2>ミッションカード</h2>
            <ul class="rule-list">
              <li>1ミッション3ポイント</li>
            </ul>
          </section>
          <section class="points-section">
            <h2>ニアピン</h2>
            <ul class="rule-list">
              <li>3ポイント</li>
              <li>パー縛りなし</li>
            </ul>
          </section>
        </div>
      </section>
      <section class="admin-section">
        <h2 class="admin-section-title">メンテナンス</h2>
        <div class="status" id="adminStatus"></div>
        <div class="admin-actions">
          <button class="button" id="clearAllButton" type="button">すべてクリア</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const MEMBERS = [
      { name: 'ヤマ', team: 'B' },
      { name: 'エモ', team: 'A' },
      { name: 'ナガ', team: 'B' },
      { name: 'タニ', team: 'B' },
      { name: '畑中', team: 'B' },
      { name: '坂本', team: 'A' },
      { name: '米井', team: 'A' },
      { name: '柴田', team: 'A' }
    ];

    const OLYMPIC_OPTIONS = [
      { label: '', value: '', points: 0 },
      { label: '鉄', value: 'iron', points: 1 },
      { label: '銅', value: 'bronze', points: 2 },
      { label: '銀', value: 'silver', points: 3 },
      { label: '金', value: 'gold', points: 4 },
      { label: 'ダイヤ', value: 'diamond', points: 5 }
    ];

    const RANK_OPTIONS = [
      { label: '1位', value: 1 },
      { label: '2位', value: 2 },
      { label: '3位', value: 3 },
      { label: '圏外', value: 4 }
    ];

    const MISSION_LABELS = [
      'ハーフ30台で回りなさい！', 'オナーを５回以上獲得せよ！', '銅パットを決めよ！', '銀パットを決めよ！',
      '合計5回以上1パットを決めよ！', '全ホールどちらかがダボ以内！', 'チップインを決めよ！', 'どちらかがハーフのグロス・トップ！',
      '鉄パットを決めよ！', 'ショートホールでニアピンを取れ！', '最初のホールでドラコン！', 'チームで３ホール連続パー！',
      'チームで１パットを１回！', '金パットを決めよ！', '両方１回以上１パットを決めよ！', 'チームで金・銀・銅・鉄を獲得！',
      'バーディを取れ！', '同じホールで両方パー！', '２番目のホールは両方ダボ以内！', 'ショートホールで１オン！',
      'パー数で相手チームを上回れ！', 'ショートホールでパー！', '１パット数で相手チームを上回れ！', '同じホールで両方１パット！'
    ];
    const MISSION_GROUPS = [
      { value: '1-front-A', label: '前半1組目Aチーム' },
      { value: '1-front-B', label: '前半1組目Bチーム' },
      { value: '2-front-A', label: '前半2組目Aチーム' },
      { value: '2-front-B', label: '前半2組目Bチーム' },
      { value: '1-back-A', label: '後半1組目Aチーム' },
      { value: '1-back-B', label: '後半1組目Bチーム' },
      { value: '2-back-A', label: '後半2組目Aチーム' },
      { value: '2-back-B', label: '後半2組目Bチーム' }
    ];
    const PARS = [4, 4, 3, 4, 3, 5, 4, 3, 5, 5, 4, 3, 4, 4, 3, 5, 4, 5];
    const HOLE_ORDER = Array.from({ length: 9 }, (_, index) => 10 + index).concat(Array.from({ length: 9 }, (_, index) => 1 + index));
    const NEAR_PIN_HOLES = [12, 15, 3, 5, 8];
    const GROSS_TIE_ORDER = ['ヤマ', 'エモ', '坂本', 'ナガ', 'タニ', '畑中', '米井', '柴田'];
    const GROUPS = [
      { label: '1組目', team: 'A', members: ['エモ', '坂本'] },
      { label: '1組目', team: 'B', members: ['ヤマ', 'ナガ'] },
      { label: '2組目', team: 'A', members: ['米井', '柴田'] },
      { label: '2組目', team: 'B', members: ['タニ', '畑中'] }
    ];

    const TEAM_LABELS = { A: 'Aチーム', B: 'Bチーム' };
    const API_URL = 'https://n6223mtla2.execute-api.ap-northeast-1.amazonaws.com/points';
    const MISSION_API_URL = `${API_URL}?data=mission`;
    const SELECTED_MEMBER_STORAGE_KEY = 'golfSelectedMember';
    let state = createInitialState();
    let missionState = createInitialMissionState();
    let selectedMember = getSavedSelectedMember();
    let saveQueue = Promise.resolve();
    let completionError = '';
    let completionErrorHole = null;
    const loadedDatasets = new Set(['olympic']);

    const elements = {
      rankingStatus: document.getElementById('rankingStatus'),
      adminStatus: document.getElementById('adminStatus'),
      teamTotals: document.getElementById('teamTotals'),
      rankingBody: document.getElementById('rankingBody'),
      memberSelect: document.getElementById('memberSelect'),
      holes: document.getElementById('holes'),
      missionList: document.getElementById('missionList'),
      validationErrors: document.getElementById('validationErrors'),
      entryBackScoreTotal: document.getElementById('entryBackScoreTotal'),
      entryBackOlympicTotal: document.getElementById('entryBackOlympicTotal'),
      entryFrontScoreTotal: document.getElementById('entryFrontScoreTotal'),
      entryFrontOlympicTotal: document.getElementById('entryFrontOlympicTotal'),
      entryScoreTotal: document.getElementById('entryScoreTotal'),
      entryOlympicTotal: document.getElementById('entryOlympicTotal'),
      reloadButton: document.getElementById('reloadButton'),
      clearAllButton: document.getElementById('clearAllButton'),
      olympicPointsTableBody: document.getElementById('olympicPointsTableBody'),
      grossPointsTableBody: document.getElementById('grossPointsTableBody'),
      netPointsTableBody: document.getElementById('netPointsTableBody')
    };

    buildMemberSelect();
    buildHoles();
    buildMissionForm();
    buildPointsTable();
    bindEvents();
    loadPoints();

    function createInitialState() {
      return {
        version: 1,
        updatedAt: null,
        members: Object.fromEntries(MEMBERS.map(member => [member.name, createMemberData()]))
      };
    }

    function createMemberData() {
      return {
        grossRank: 4,
        netRank: 4,
        holes: PARS.map(par => ({ score: par, olympic: '', completed: false, nearPin: false }))
      };
    }

    function createInitialMissionState() {
      return {
        version: 1,
        updatedAt: null,
        groups: Object.fromEntries(MISSION_GROUPS.map(group => [group.value, Array.from({ length: 6 }, () => ({ mission: '', completedA: false, completedB: false }))]))
      };
    }

    function normalizeState(input) {
      const next = createInitialState();
      if (!input || typeof input !== 'object') return next;
      next.updatedAt = input.updatedAt || null;
      for (const member of MEMBERS) {
        const saved = input.members?.[member.name] || {};
        next.members[member.name].grossRank = clampNumber(saved.grossRank, 1, 4, next.members[member.name].grossRank);
        next.members[member.name].netRank = clampNumber(saved.netRank, 1, 4, next.members[member.name].netRank);
        next.members[member.name].holes = Array.from({ length: 18 }, (_, index) => {
          const hole = saved.holes?.[index] || {};
          return {
            score: normalizeScore(hole.score),
            olympic: OLYMPIC_OPTIONS.some(option => option.value === hole.olympic) ? hole.olympic : '',
            completed: Boolean(hole.completed),
            nearPin: Boolean(hole.nearPin)
          };
        });
      }
      return next;
    }

    function normalizeMissionState(input) {
      const next = createInitialMissionState();
      if (!input || typeof input !== 'object') return next;
      next.updatedAt = input.updatedAt || null;
      MISSION_GROUPS.forEach(group => {
        const values = input.groups?.[group.value] || [];
        next.groups[group.value] = Array.from({ length: 6 }, (_, index) => {
          const value = values[index] || {};
          const mission = Number(value.mission);
          return {
            mission: Number.isInteger(mission) && mission >= 1 && mission <= MISSION_LABELS.length ? String(mission) : '',
            completedA: Boolean(value.completedA ?? false),
            completedB: Boolean(value.completedB ?? false)
          };
        });
      });
      return next;
    }

    function bindEvents() {
      document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
      });
      elements.reloadButton.addEventListener('click', loadPoints);
      elements.clearAllButton.addEventListener('click', clearAllData);
      elements.missionList.addEventListener('change', event => {
        const group = event.target.dataset.missionGroup;
        const index = Number(event.target.dataset.missionIndex);
        if (!group || !Number.isInteger(index)) return;
        const mission = missionState.groups[group][index];
        if (event.target.matches('[data-mission-select]')) mission.mission = event.target.value;
        if (event.target.matches('[data-mission-completed]')) {
          const team = event.target.dataset.missionTeam;
          if (team === 'A') mission.completedA = event.target.checked;
          if (team === 'B') mission.completedB = event.target.checked;
        }
        render();
        requestDatasetSave(MISSION_API_URL, missionState, value => { missionState = normalizeMissionState(value); render(); });
      });
      elements.memberSelect.addEventListener('change', async () => {
        const previousMember = selectedMember;
        const nextMember = elements.memberSelect.value;
        saveCurrentForm();
        selectedMember = nextMember;
        localStorage.setItem(SELECTED_MEMBER_STORAGE_KEY, selectedMember);
        renderEntryForm();
        requestSave(previousMember, null, false);
        saveQueue.then(() => loadPoints());
      });
    }

    function getSavedSelectedMember() {
      const savedMember = localStorage.getItem(SELECTED_MEMBER_STORAGE_KEY);
      return MEMBERS.some(member => member.name === savedMember) ? savedMember : MEMBERS[0].name;
    }

    function buildMissionForm() {
      elements.missionList.innerHTML = MISSION_GROUPS.map(group => {
        const team = group.value.endsWith('-A') ? 'A' : 'B';
        return `
          <section class="points-section">
            <h2>${group.label}</h2>
            <div class="mission-table">
              ${Array.from({ length: 6 }, (_, index) => `
                <div class="mission-row">
                  <select data-mission-group="${group.value}" data-mission-index="${index}" data-mission-select>
                    <option value="">＜ミッション選択＞</option>
                    ${MISSION_LABELS.map((label, missionIndex) => `<option value="${missionIndex + 1}">${missionIndex + 1}. ${label}</option>`).join('')}
                  </select>
                  <label class="mission-completion">
                    <input type="checkbox" data-mission-group="${group.value}" data-mission-index="${index}" data-mission-team="${team}" data-mission-completed>
                    <span>達成</span>
                  </label>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function renderMissionForm() {
      elements.missionList.querySelectorAll('[data-mission-select]').forEach(select => {
        const mission = missionState.groups[select.dataset.missionGroup][Number(select.dataset.missionIndex)];
        select.value = mission.mission;
      });
      elements.missionList.querySelectorAll('[data-mission-completed]').forEach(input => {
        const mission = missionState.groups[input.dataset.missionGroup][Number(input.dataset.missionIndex)];
        const team = input.dataset.missionTeam;
        input.checked = team === 'A' ? mission.completedA : mission.completedB;
      });
    }

    function buildPointsTable() {
      const olympicRows = OLYMPIC_OPTIONS
        .filter(option => option.value !== '')
        .map(option => ({ item: option.label, points: option.points }));
      const grossRows = RANK_OPTIONS.map(option => ({ item: option.label, points: grossRankToPoints(option.value) }));
      const netRows = RANK_OPTIONS.map(option => ({ item: option.label, points: netRankToPoints(option.value) }));

      const renderRows = rows => rows
        .sort((left, right) => right.points - left.points || left.item.localeCompare(right.item, 'ja'))
        .map(row => `
        <tr>
          <td>${row.item}</td>
          <td>${row.points}点</td>
        </tr>
        `).join('');
      elements.olympicPointsTableBody.innerHTML = renderRows(olympicRows);
      elements.grossPointsTableBody.innerHTML = renderRows(grossRows);
      elements.netPointsTableBody.innerHTML = renderRows(netRows);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-button').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
      document.getElementById('rankingPanel').classList.toggle('active', tab === 'ranking');
      document.getElementById('entryPanel').classList.toggle('active', tab === 'entry');
      document.getElementById('missionPanel').classList.toggle('active', tab === 'mission');
      document.getElementById('adminPanel').classList.toggle('active', tab === 'admin');
      render();
      if (tab === 'mission') loadDataset(tab);
      if (tab === 'entry') requestAnimationFrame(scrollToNextEntryHole);
    }

    function scrollToNextEntryHole() {
      const nextHoleIndex = getNextEntryHoleIndex(selectedMember);
      const displayIndex = nextHoleIndex < 18 ? [10, 11, 12, 13, 14, 15, 16, 17, 18, 1, 2, 3, 4, 5, 6, 7, 8, 9].indexOf(nextHoleIndex + 1) : elements.holes.children.length - 1;
      const target = displayIndex >= 0 ? elements.holes.children[displayIndex] : elements.holes.lastElementChild;
      target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function buildMemberSelect() {
      elements.memberSelect.innerHTML = MEMBERS
        .map(member => `<option value="${member.name}">${member.name} / ${TEAM_LABELS[member.team]}</option>`)
        .join('');
      elements.memberSelect.value = selectedMember;
    }

    function buildHoles() {
      elements.holes.innerHTML = '';
      HOLE_ORDER.forEach((holeNumber) => {
        const index = holeNumber - 1;
        const hole = document.createElement('article');
        hole.className = 'hole';
        hole.innerHTML = `
          <div class="hole-title">
            <span class="hole-label"><label class="complete-field"><input type="checkbox" data-hole="${index}" data-field="completed"></label><span>${holeNumber}H</span><span class="hole-par">(PAR:${PARS[index]})</span></span>
            ${NEAR_PIN_HOLES.includes(holeNumber) ? `<label class="near-pin-badge"><input type="checkbox" data-hole="${index}" data-field="nearPin">ニアピン</label>` : ''}
          </div>
          <label class="field">
            <span class="stepper">
              <button type="button" data-score-step="${index}" data-delta="-1" aria-label="${holeNumber}Hのスコアを1減らす">−</button>
              <input type="number" min="1" max="99" inputmode="numeric" data-hole="${index}" data-field="score">
              <button type="button" data-score-step="${index}" data-delta="1" aria-label="${holeNumber}Hのスコアを1増やす">＋</button>
            </span>
          </label>
          <label class="field">オリンピック
            <select data-hole="${index}" data-field="olympic">
              ${OLYMPIC_OPTIONS.map(option => `<option value="${option.value}">${option.label}${option.points ? `(${option.points})` : ''}</option>`).join('')}
            </select>
          </label>
          <div class="hole-error" data-hole-error="${index}" role="alert"></div>
        `;
        elements.holes.appendChild(hole);
      });
      elements.holes.addEventListener('change', event => {
        const target = event.target;
        if (target.dataset.hole) {
          const holeIndex = Number(target.dataset.hole);
          if (target.matches('[data-field="score"]') && !markHoleCompletedFromScore(holeIndex)) {
            render();
            return;
          }
          if (target.matches('[data-field="completed"]') && target.checked && !isNextHoleToComplete(selectedMember, holeIndex)) {
            completionError = `${holeIndex + 1}Hは順番が違います！前のホールで入れ忘れませんか？`;
            completionErrorHole = holeIndex;
            render();
            return;
          }
          completionError = '';
          completionErrorHole = null;
          saveCurrentForm();
          requestSave(selectedMember, holeIndex);
        }
        render();
      });
      elements.holes.addEventListener('click', event => {
        const button = event.target.closest('[data-score-step]');
        if (!button) return;
        const holeIndex = Number(button.dataset.scoreStep);
        const input = elements.holes.querySelector(`[data-hole="${holeIndex}"][data-field="score"]`);
        const currentScore = normalizeScore(input.value);
        const nextScore = currentScore === ''
          ? (Number(button.dataset.delta) > 0 ? 1 : '')
          : clampNumber(currentScore + Number(button.dataset.delta), 1, 99, 1);
        input.value = nextScore;
        if (!markHoleCompletedFromScore(holeIndex)) {
          render();
          return;
        }
        saveCurrentForm();
        render();
        requestSave(selectedMember, holeIndex);
      });
    }

    function render() {
      renderEntryForm();
      renderMissionForm();
      renderRanking();
      renderValidation();
    }

    function renderEntryForm() {
      const member = state.members[selectedMember];
      const completionErrors = getCompletionErrors(selectedMember);
      if (completionError) completionErrors[completionErrorHole] = completionError;
      elements.memberSelect.value = selectedMember;
      member.holes.forEach((hole, index) => {
        elements.holes.querySelector(`[data-hole="${index}"][data-field="score"]`).value = hole.score;
        elements.holes.querySelector(`[data-hole="${index}"][data-field="completed"]`).checked = hole.completed;
        elements.holes.querySelector(`[data-hole="${index}"][data-field="olympic"]`).value = hole.olympic;
        const nearPinCheckbox = elements.holes.querySelector(`[data-hole="${index}"][data-field="nearPin"]`);
        if (nearPinCheckbox) nearPinCheckbox.checked = hole.nearPin;
        const errorElement = elements.holes.querySelector(`[data-hole-error="${index}"]`);
        const errorMessage = completionErrors[index] || '';
        errorElement.textContent = errorMessage;
        errorElement.classList.toggle('visible', Boolean(errorMessage));
      });
      const totals = member.holes.reduce((result, hole, index) => {
        if (hole.completed && hole.score !== '') result.score += Number(hole.score);
        if (hole.completed) result.olympic += getOlympicPoints(hole.olympic);
        const subtotal = index < 9 ? result.front : result.back;
        if (hole.completed && hole.score !== '') subtotal.score += Number(hole.score);
        if (hole.completed) subtotal.olympic += getOlympicPoints(hole.olympic);
        return result;
      }, {
        score: 0,
        olympic: 0,
        front: { score: 0, olympic: 0 },
        back: { score: 0, olympic: 0 }
      });
      elements.entryBackScoreTotal.textContent = totals.back.score;
      elements.entryBackOlympicTotal.textContent = totals.back.olympic;
      elements.entryFrontScoreTotal.textContent = totals.front.score;
      elements.entryFrontOlympicTotal.textContent = totals.front.olympic;
      elements.entryScoreTotal.textContent = totals.score;
      elements.entryOlympicTotal.textContent = totals.olympic;
    }

    function renderRanking() {
      const rows = MEMBERS.map(member => ({ member, score: calculateMemberScore(member.name) }))
        .sort((left, right) => right.score.total - left.score.total || left.member.name.localeCompare(right.member.name, 'ja'));
      elements.rankingBody.innerHTML = rows.map((row, index) => `
        <tr class="team-${row.member.team.toLowerCase()} ">
          <td>${index + 1}</td>
          <td>${row.member.name}</td>
          <td><strong>${row.score.total}</strong></td>
          <td>${getProgressLabel(row.member.name)}</td>
          <td>${row.score.olympic}</td>
          <td>${row.score.nearPin}</td>
          <td>${formatScoreDifference(row.score.score)}</td>
          <td>${formatRankPoints(row.score.gross, row.score.grossRank)}</td>
          <td>${formatRankPoints(row.score.net, row.member.netRank)}</td>
        </tr>
      `).join('');

      const totals = calculateTeamTotals();
      const winningTeam = totals.A.total === totals.B.total ? null : totals.A.total > totals.B.total ? 'A' : 'B';
      elements.teamTotals.innerHTML = ['A', 'B'].map(team => `
        <article class="team-total team-${team.toLowerCase()}${winningTeam === team ? ' winning' : ''}">
          <strong>${TEAM_LABELS[team]}</strong>
          <span>${totals[team].total}</span>
          <div class="team-total-breakdown">
            <strong><span>メンバー:</span><span class="point-value">${totals[team].member}</span></strong>
            <strong><span>ミッション:</span><span class="point-value">${totals[team].mission}</span></strong>
            <strong><span>カン:</span><span class="point-value">${totals[team].kan}</span></strong>
          </div>
          <div class="team-kan-breakdown">
            ${totals[team].kanEntries.length ? totals[team].kanEntries.map(entry => `<div>${entry}</div>`).join('') : '<div>なし</div>'}
          </div>
        </article>
      `).join('');
    }

    function renderValidation() {
      const errors = validateRanks();
      elements.validationErrors.classList.toggle('visible', errors.length > 0);
      elements.validationErrors.innerHTML = errors.join('<br>');
    }

    function markHoleCompletedFromScore(holeIndex) {
      const hole = state.members[selectedMember].holes[holeIndex];
      if (!hole.completed && !isNextHoleToComplete(selectedMember, holeIndex)) {
        completionError = `${holeIndex + 1}Hは順番が違います。先に前のホールを済にしてください。`;
        completionErrorHole = holeIndex;
        return false;
      }
      elements.holes.querySelector(`[data-hole="${holeIndex}"][data-field="completed"]`).checked = true;
      completionError = '';
      completionErrorHole = null;
      return true;
    }

    function saveCurrentForm() {
      const member = state.members[selectedMember];
      member.holes = member.holes.map((hole, index) => ({
        score: normalizeScore(elements.holes.querySelector(`[data-hole="${index}"][data-field="score"]`).value),
        olympic: elements.holes.querySelector(`[data-hole="${index}"][data-field="olympic"]`).value,
        completed: elements.holes.querySelector(`[data-hole="${index}"][data-field="completed"]`).checked,
        nearPin: NEAR_PIN_HOLES.includes(index + 1) ? elements.holes.querySelector(`[data-hole="${index}"][data-field="nearPin"]`).checked : false
      }));
    }

    function updateRank(field, value) {
      state.members[selectedMember][field] = clampNumber(value, 1, 4, 1);
      render();
      requestSave();
    }

    function validateRanks() {
      const errors = [];
      for (const field of ['netRank']) {
        const label = field === 'grossRank' ? 'グロス順位' : 'ネット順位';
        const counts = new Map();
        MEMBERS.forEach(member => {
          const name = member.name;
          const rank = state.members[name][field];
          if (rank <= 3) {
            counts.set(rank, [...(counts.get(rank) || []), name]);
          }
        });
        counts.forEach((names, rank) => {
          if (names.length > 1) errors.push(`${label} ${rankToLabel(rank)}が重複しています: ${names.join('、')}`);
        });
      }
      return errors;
    }

    function validateCompletionOrder() {
      const errors = [];
      MEMBERS.forEach(member => {
        Object.keys(getCompletionErrors(member.name)).forEach(holeIndex => {
          errors.push(`${member.name}の${Number(holeIndex) + 1}Hが順番どおりではありません。`);
        });
      });
      return errors;
    }

    function getCompletionErrors(memberName) {
      const errors = {};
      let foundGap = false;
      HOLE_ORDER.forEach(holeNumber => {
        const completed = state.members[memberName].holes[holeNumber - 1].completed;
        if (!completed) {
          foundGap = true;
        } else if (foundGap) {
          errors[holeNumber - 1] = `${holeNumber}Hが順番どおりではありません。`;
        }
      });
      return errors;
    }

    function calculateMemberScore(memberName) {
      const member = state.members[memberName];
      const olympic = member.holes.reduce((sum, hole) => sum + getOlympicPoints(hole.olympic), 0);
      const nearPin = member.holes.filter(hole => hole.nearPin).length * 3;
      const score = calculateScoreDifference(memberName);
      const grossRank = getGrossRanks().get(memberName);
      const gross = grossRankToPoints(grossRank);
      const net = netRankToPoints(member.netRank);
      return { olympic, nearPin, score, grossRank, gross, net, total: olympic + nearPin + gross + net };
    }

    function calculateScoreDifference(memberName) {
      return state.members[memberName].holes.reduce((sum, hole, index) => hole.completed && hole.score !== '' ? sum + Number(hole.score) - PARS[index] : sum, 0);
    }

    function getGrossRanks() {
      return new Map(GROSS_TIE_ORDER
        .filter(memberName => state.members[memberName].holes.some(hole => hole.completed))
        .map(memberName => ({ memberName, score: calculateScoreDifference(memberName) }))
        .sort((left, right) => left.score - right.score)
        .map((entry, index) => [entry.memberName, index < 3 ? index + 1 : 4]));
    }

    function formatGrossRank(rank) {
      return rank ? rankToLabel(rank) : '';
    }

    function formatRankPoints(points, rank) {
      const rankLabel = rank ? rankToLabel(rank) : '';
      return rankLabel ? `${points}(${rankLabel})` : String(points);
    }

    function formatScoreDifference(score) {
      return score > 0 ? `+${score}` : String(score);
    }

    function getProgressLabel(memberName) {
      const completedCount = state.members[memberName].holes.filter(hole => hole.completed).length;
      return completedCount === 0 ? '' : `${HOLE_ORDER[completedCount - 1]}H`;
    }

    function getNextEntryHoleIndex(memberName) {
      const holes = state.members[memberName].holes;
      const nextHoleNumber = HOLE_ORDER.find(holeNumber => !holes[holeNumber - 1].completed);
      return nextHoleNumber === undefined ? holes.length : nextHoleNumber - 1;
    }

    function isNextHoleToComplete(memberName, holeIndex) {
      return getNextEntryHoleIndex(memberName) === holeIndex;
    }

    function getOlympicPoints(olympic) {
      const option = OLYMPIC_OPTIONS.find(item => item.value === olympic);
      if (!option || !option.points) return 0;
      return option.points;
    }

    function grossRankToPoints(rank) {
      return { 1: 7, 2: 5, 3: 3, 4: 0 }[rank] || 0;
    }

    function netRankToPoints(rank) {
      return { 1: 10, 2: 6, 3: 4, 4: 0 }[rank] || 0;
    }

    function rankToLabel(rank) {
      return RANK_OPTIONS.find(option => option.value === rank)?.label || '圏外';
    }

    function calculateTeamTotals() {
      const totals = MEMBERS.reduce((result, member) => {
        const memberPoints = calculateMemberScore(member.name).total;
        result[member.team].member += memberPoints;
        result[member.team].total += memberPoints;
        return result;
      }, {
        A: { member: 0, mission: calculateTeamMissionPoints('A'), kan: 0, kanEntries: [], total: 0 },
        B: { member: 0, mission: calculateTeamMissionPoints('B'), kan: 0, kanEntries: [], total: 0 }
      });
      ['A', 'B'].forEach(team => {
        const kan = calculateTeamKanPoints(team);
        totals[team].kan = kan.points;
        totals[team].kanEntries = kan.entries;
        totals[team].total += kan.points;
      });
      return totals;
    }

    function calculateTeamKanPoints(team) {
      return GROUPS
        .filter(group => group.team === team)
        .reduce((result, group) => {
          OLYMPIC_OPTIONS
            .filter(option => option.value !== '')
            .forEach(option => {
              const count = group.members.reduce((sum, memberName) => sum + state.members[memberName].holes.filter(hole => hole.olympic === option.value).length, 0);
              const kanCount = Math.floor(count / 4) * 4;
              if (!kanCount) return;
              result.points += kanCount * option.points;
              result.entries.push(`${group.label} ${option.label}(${option.points})×${kanCount}=${kanCount * option.points}`);
            });
          return result;
        }, { points: 0, entries: [] });
    }

    function calculateTeamMissionPoints(team) {
      const completedMissions = MISSION_GROUPS
        .flatMap(group => missionState.groups[group.value])
        .filter(mission => team === 'A' ? mission.completedA : mission.completedB).length;
      return completedMissions * 3;
    }

    async function loadPoints() {
      if (!API_URL || API_URL.includes('xxxx.execute-api')) {
        render();
        return;
      }
      setLoading(true);
      setStatus(elements.rankingStatus, '読み込み中...');
      try {
        state = normalizeState(await fetch(API_URL, { method: 'GET' }).then(response => readApiResponse(response, 'スコア')));
        loadedDatasets.add('olympic');
        await loadDataset('mission');
        render();
        setStatus(elements.rankingStatus, '読み込みました。');
      } catch (error) {
        setStatus(elements.rankingStatus, `読み込みに失敗しました: ${error.message}`, true);
        render();
      } finally {
        setLoading(false);
      }
    }

    async function readApiResponse(response, datasetName) {
      if (!response.ok) throw new Error(`${datasetName} HTTP ${response.status}`);
      return response.json();
    }

    async function loadDataset(dataset) {
      if (loadedDatasets.has(dataset)) return;
      const url = MISSION_API_URL;
      try {
        const data = await fetch(url, { method: 'GET' }).then(response => readApiResponse(response, 'ミッション'));
        missionState = normalizeMissionState(data);
        loadedDatasets.add(dataset);
        render();
      } catch (error) {
        setStatus(elements.rankingStatus, `ミッションの読み込みに失敗しました: ${error.message}`, true);
      }
    }

    async function clearAllData() {
      if (!window.confirm('入力したデータがすべて削除され、全員に反映されますが大丈夫ですか？')) return;
      if (!window.confirm('本当に大丈夫ですか？')) return;
      if (!API_URL || API_URL.includes('xxxx.execute-api')) {
        setStatus(elements.adminStatus, 'API URLが設定されていません。', true);
        return;
      }
      setLoading(true);
      elements.clearAllButton.disabled = true;
      setStatus(elements.adminStatus, 'データを削除中...');
      try {
        const response = await fetch(`${API_URL}?action=clearAll`, { method: 'DELETE' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        localStorage.clear();
        state = createInitialState();
        missionState = createInitialMissionState();
        loadedDatasets.clear();
        loadedDatasets.add('olympic');
        selectedMember = MEMBERS[0].name;
        render();
        setStatus(elements.adminStatus, 'localStorageとS3のデータを削除しました。');
      } catch (error) {
        setStatus(elements.adminStatus, `削除に失敗しました: ${error.message}`, true);
      } finally {
        setLoading(false);
        elements.clearAllButton.disabled = false;
      }
    }

    async function savePoints(memberName = selectedMember, holeIndex = null, syncForm = true) {
      if (syncForm) saveCurrentForm();
      const errors = [...validateRanks(), ...validateCompletionOrder()];
      if (errors.length) {
        renderValidation();
        return;
      }
      if (!API_URL || API_URL.includes('xxxx.execute-api')) {
        return;
      }
      state.updatedAt = new Date().toISOString();
      setLoading(true);
      try {
        const response = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...state, changedMember: memberName, changedHole: holeIndex })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state = normalizeState(await response.json());
        render();
      } catch (error) {
        console.error(`保存に失敗しました: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    async function saveDataset(url, dataset) {
      const response = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataset)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function requestDatasetSave(url, dataset, applyResponse) {
      saveQueue = saveQueue.then(async () => {
        try {
          const saved = await saveDataset(url, dataset);
          applyResponse(saved);
          render();
        } catch (error) {
          console.error(`保存に失敗しました: ${error.message}`);
        }
      });
    }

    function requestSave(memberName = selectedMember, holeIndex = null, syncForm = true) {
      saveQueue = saveQueue.then(() => savePoints(memberName, holeIndex, syncForm));
    }

    function setLoading(isLoading) {
      elements.reloadButton.disabled = isLoading;
    }

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle('error', isError);
    }

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, Math.trunc(number)));
    }

    function normalizeScore(value) {
      return value === '' || value === null || value === undefined
        ? ''
        : clampNumber(value, 1, 99, '');
    }
  </script>
</body>
